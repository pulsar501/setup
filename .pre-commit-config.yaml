repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: pretty-format-json
        exclude: lazy-lock\.json$
      - id: check-toml
      - id: check-xml
      - id: check-json
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ansible-vault-check
        name: secrets must be vault-encrypted
        language: system
        entry: bash -c 'unenc=$(grep -rLE "ANSIBLE_VAULT" secrets/ 2>/dev/null | grep -v "\.pub$"); [ -z "$unenc" ] || { echo "Unencrypted files in secrets/:"; echo "$unenc"; exit 1; }'
        pass_filenames: false
        always_run: true
