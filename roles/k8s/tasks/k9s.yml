---
# On macOS k9s comes from Homebrew. Linux only.
- name: Get latest k9s version
  ansible.builtin.uri:
    url: https://api.github.com/repos/derailed/k9s/releases/latest
    body_format: json
    return_content: true
  register: k9s_release
  when: ansible_facts['os_family'] != 'Darwin'
  tags: &k9s_tags ["dev", "k9s"]

- name: Download k9s archive
  vars:
    arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else ansible_architecture }}"
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/{{ k9s_release.json.tag_name }}/k9s_Linux_{{ arch }}.tar.gz"
    dest: /tmp/k9s.tar.gz
    mode: "0644"
  when: ansible_facts['os_family'] != 'Darwin'
  tags: *k9s_tags

- name: Unpack k9s binary
  become: true
  ansible.builtin.unarchive:
    src: /tmp/k9s.tar.gz
    dest: /usr/local/bin
    extra_opts: ["k9s"]
    remote_src: true
    mode: "0755"
  when: ansible_facts['os_family'] != 'Darwin'
  tags: *k9s_tags

- name: Remove k9s archive
  ansible.builtin.file:
    path: /tmp/k9s.tar.gz
    state: absent
  when: ansible_facts['os_family'] != 'Darwin'
  tags: *k9s_tags
