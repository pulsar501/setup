---
- name: Install ZSH
  become: true
  ansible.builtin.apt:
    name:
      - zsh
  tags: &tags_for_zsh_tasks ["core", "zsh"]

- name: Change shell to zsh
  become: true
  ansible.builtin.shell: chsh --shell $(which zsh) {{ me }}
  changed_when: true
  tags: *tags_for_zsh_tasks

- name: Configure global zshenv
  become: true
  ansible.builtin.blockinfile:
    block: "{{ lookup('template', 'etc_zshenv.j2') }}"
    dest: /etc/zsh/zshenv
    marker: "# {mark} ANSIBLE MANAGED"
  tags: *tags_for_zsh_tasks

- name: Check that the oh-my-zsh exists
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/zsh/ohmyzsh"
  register: oh_my_stats
  tags: *tags_for_zsh_tasks

- name: Oh-My-Zsh
  ansible.builtin.shell: |
    source {{ ansible_env.HOME }}/.bashrc
    bash -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  changed_when: true
  tags: *tags_for_zsh_tasks
  when: not oh_my_stats.stat.exists

- name: Install zsh plugins
  ansible.builtin.shell: |
    source {{ ansible_env.HOME }}/.bashrc
    PLUGIN_DIR="$ZSH/custom/plugins/{{ item.name }}"
    if [[ -d "$PLUGIN_DIR" ]]; then
      cd "$PLUGIN_DIR" && git pull
    else
      git clone "https://github.com/{{ item.user }}/{{ item.name }}" "$PLUGIN_DIR"
    fi
  changed_when: true
  loop:
    - name: zsh-autosuggestions
      user: zsh-users
    - name: zsh-defer
      user: romkatv
    - name: zsh-vi-mode
      user: jeffreytse
    - name: zsh-syntax-highlighting
      user: zsh-users
    - name: zsh-completions
      user: zsh-users
    - name: zsh-history-substring-search
      user: zsh-users
    - name: turv
      user: ppfenning92
  tags: *tags_for_zsh_tasks

- name: Install Starship
  become: true
  ansible.builtin.shell: |
    set -o pipefail;
    curl -sS https://starship.rs/install.sh | sh -s -- -y
  changed_when: true
  tags: *tags_for_zsh_tasks
