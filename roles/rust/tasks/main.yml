---
- name: Install rustup
  ansible.builtin.shell: |
    set -o pipefail;
    curl https://sh.rustup.rs -sSf | sh -s -- --profile=complete --no-modify-path -y
  changed_when: true
  tags:
    - core
    - update
    - rust

- name: Set rust to stable
  ansible.builtin.shell: $CARGO_HOME/bin/rustup default stable
  changed_when: true
  tags:
    - core
    - update
    - rust

- name: Install core CLI tools (rust rewrites for common utils)
  # On macOS these come from Homebrew (pre-compiled bottles). Linux only.
  ansible.builtin.shell: $CARGO_HOME/bin/cargo install {{ item }}
  changed_when: true
  when: ansible_facts['os_family'] != 'Darwin'
  loop:
    - eza        # ls
    - bat        # cat / less
    - zoxide     # cd
    - eva        # calc
    - starship   # prompt
  tags:
    - core
    - update
    - rust

- name: Install dev CLI tools (rust rewrites)
  # On macOS these come from Homebrew (pre-compiled bottles). Linux only.
  ansible.builtin.shell: $CARGO_HOME/bin/cargo install {{ item }}
  changed_when: true
  when: ansible_facts['os_family'] != 'Darwin'
  loop:
    - ripgrep    # grep
    - fd-find    # find
    - du-dust    # du
    - sd         # sed (simple substitutions)
    - procs      # ps
    - bandwhich  # network monitor
    - hyperfine  # benchmarking / time
    - tealdeer   # tldr / man
    - delta      # git diff viewer
    - tokei      # code stats
  tags:
    - dev
    - update
    - rust

- name: Install neovim tooling
  # On macOS stylua comes from Homebrew. Linux only.
  ansible.builtin.shell: $CARGO_HOME/bin/cargo install {{ item }}
  changed_when: true
  when: ansible_facts['os_family'] != 'Darwin'
  loop:
    - stylua
  tags:
    - dev
    - neovim
    - rust
