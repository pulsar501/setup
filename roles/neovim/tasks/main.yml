---
# macOS: neovim via Homebrew (formulae.yml)
# Arch:  neovim via pacman (official extra repo)
# Debian: Ubuntu ships an outdated neovim — build from source

- name: Install neovim build dependencies (Debian)
  become: true
  ansible.builtin.apt:
    name:
      - ninja-build
      - cmake
      - gettext
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["core", "neovim"]

- name: Clone neovim (Debian)
  ansible.builtin.git:
    repo: https://github.com/neovim/neovim.git
    dest: "{{ ansible_env.HOME }}/neovim"
    update: true
  changed_when: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["core", "neovim"]

- name: Build neovim (Debian)
  ansible.builtin.shell: "cd {{ ansible_env.HOME }}/neovim && make -j$(nproc)"
  changed_when: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["core", "neovim"]

- name: Install neovim (Debian)
  become: true
  ansible.builtin.shell: "cd {{ ansible_env.HOME }}/neovim && make install"
  changed_when: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["core", "neovim"]

- name: Remove neovim src dir (Debian)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/neovim"
    state: absent
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["core", "neovim"]
