---
- name: Install node/deno/bun via mise
  ansible.builtin.shell: mise use --global node@latest deno@latest bun@latest
  changed_when: true
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/share/mise/bin:/opt/homebrew/bin:{{ ansible_env.PATH }}"
  tags: ["node", "dev"]

- name: Install pnpm globally
  ansible.builtin.shell: npm install -g pnpm
  changed_when: true
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.HOME }}/.local/share/mise/bin:/opt/homebrew/bin:{{ ansible_env.PATH }}"
  tags: ["node", "dev"]
