---
- name: Disable verbose Ubuntu MOTD scripts
  become: true
  ansible.builtin.file:
    path: "/etc/update-motd.d/{{ item }}"
    mode: "0644"
  loop:
    - 00-header
    - 10-help-text
    - 50-landscape-sysinfo
    - 50-motd-news
    - 85-fwupd
    - 90-updates-available
    - 91-contract-ua-esm-status
    - 91-release-upgrade
    - 92-unattended-upgrades
    - 95-hwe-eol
    - 97-overlayroot
    - 98-fsck-at-reboot
    - 98-reboot-required
  ignore_errors: true
  tags: [motd]

- name: Ensure fastfetch config directory
  become: true
  ansible.builtin.file:
    path: /etc/fastfetch
    state: directory
    mode: "0755"
  tags: [motd]

- name: Deploy fastfetch config
  become: true
  ansible.builtin.template:
    src: motd.jsonc.j2
    dest: /etc/fastfetch/motd.jsonc
    mode: "0644"
  tags: [motd]

- name: Deploy custom banner script
  become: true
  ansible.builtin.template:
    src: banner.sh.j2
    dest: /etc/update-motd.d/01-banner
    mode: "0755"
  tags: [motd]
