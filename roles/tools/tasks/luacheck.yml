---
# On macOS luacheck comes from Homebrew. Linux only.
# Installed via luarocks so it works on both Ubuntu and Arch.
- name: Install luacheck via luarocks
  become: true
  ansible.builtin.shell: luarocks install luacheck
  changed_when: true
  when: ansible_facts['os_family'] != 'Darwin'
  tags: ["dev", "lua", "neovim"]
