---
# On macOS lua-language-server comes from Homebrew; on Arch via pacman. Debian only.
- name: Get latest lua-language-server version
  ansible.builtin.uri:
    url: https://api.github.com/repos/LuaLS/lua-language-server/releases/latest
    body_format: json
    return_content: true
  register: lua_ls_release
  when: ansible_facts['os_family'] == 'Debian'
  tags: &lua_ls_tags ["dev", "neovim", "lua-ls"]

- name: Download lua-language-server archive
  vars:
    arch: "{{ 'x64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else ansible_architecture }}"
  ansible.builtin.get_url:
    url: "https://github.com/LuaLS/lua-language-server/releases/download/{{ lua_ls_release.json.tag_name }}/lua-language-server-{{ lua_ls_release.json.tag_name }}-linux-{{ arch }}.tar.gz"
    dest: /tmp/lua-ls.tar.gz
    mode: "0644"
  when: ansible_facts['os_family'] == 'Debian'
  tags: *lua_ls_tags

- name: Create install dir for lua-language-server
  become: true
  ansible.builtin.file:
    path: /opt/lua-language-server
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == 'Debian'
  tags: *lua_ls_tags

- name: Unpack lua-language-server
  become: true
  ansible.builtin.unarchive:
    src: /tmp/lua-ls.tar.gz
    dest: /opt/lua-language-server
    mode: "0755"
  when: ansible_facts['os_family'] == 'Debian'
  tags: *lua_ls_tags

- name: Symlink lua-language-server to PATH
  become: true
  ansible.builtin.file:
    src: /opt/lua-language-server/bin/lua-language-server
    dest: /usr/local/bin/lua-language-server
    state: link
  when: ansible_facts['os_family'] == 'Debian'
  tags: *lua_ls_tags

- name: Remove lua-ls archive
  ansible.builtin.file:
    path: /tmp/lua-ls.tar.gz
    state: absent
  when: ansible_facts['os_family'] == 'Debian'
  tags: *lua_ls_tags
