---
# Go installation strategy:
# Debian: fetch latest from go.dev (apt is extremely outdated)
# Arch:   pacman -S go (rolling, always current)
# macOS:  brew install go (added to homebrew formulae)

- name: Get latest Go version (Debian)
  ansible.builtin.uri:
    url: https://go.dev/VERSION?m=text
    return_content: true
  register: go_latest
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["go", "dev"]

- name: Set Go version fact (Debian)
  ansible.builtin.set_fact:
    go_ver: "{{ go_latest.content.split('\n')[0] }}"
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["go", "dev"]

- name: Download Go (Debian)
  vars:
    arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else ansible_architecture }}"
  ansible.builtin.get_url:
    url: "https://go.dev/dl/{{ go_ver }}.linux-{{ arch }}.tar.gz"
    dest: "/tmp/{{ go_ver }}.tar.gz"
    mode: "0644"
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["go", "dev"]

- name: Extract Go (Debian)
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/{{ go_ver }}.tar.gz"
    dest: /usr/local
    remote_src: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["go", "dev"]

- name: Remove Go installer (Debian)
  ansible.builtin.file:
    path: "/tmp/{{ go_ver }}.tar.gz"
    state: absent
  when: ansible_facts['os_family'] == 'Debian'
  tags: ["go", "dev"]

- name: Install Go (Arch)
  become: true
  community.general.pacman:
    name: go
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: ["go", "dev"]

- name: Install terminal tools via go (Linux)
  # macOS: glow and gum come from Homebrew
  ansible.builtin.shell: go install {{ item }}
  changed_when: true
  environment:
    PATH: "/usr/local/go/bin:/usr/bin:{{ ansible_env.PATH }}"
    GOPATH: "{{ ansible_env.HOME }}/.local/share/go"
  loop:
    - github.com/charmbracelet/glow@latest
    - github.com/charmbracelet/gum@latest
  when: ansible_facts['os_family'] != 'Darwin'
  tags: ["go", "dev"]

- name: Install Go dev tools
  # PATH covers Debian (/usr/local/go/bin), Arch (/usr/bin), macOS (/opt/homebrew/bin)
  ansible.builtin.shell: go install {{ item }}
  changed_when: true
  environment:
    PATH: "/usr/local/go/bin:/usr/bin:/opt/homebrew/bin:{{ ansible_env.PATH }}"
    GOPATH: "{{ ansible_env.HOME }}/.local/share/go"
  loop:
    - github.com/incu6us/goimports-reviser/v3@latest
    - mvdan.cc/gofumpt@latest
    - github.com/segmentio/golines@latest
  tags: ["go", "dev"]

- name: Install lazydocker via go (Linux)
  # macOS: lazydocker via Homebrew (formulae.yml)
  ansible.builtin.shell: go install github.com/jesseduffield/lazydocker@latest
  changed_when: true
  environment:
    PATH: "/usr/local/go/bin:/usr/bin:{{ ansible_env.PATH }}"
    GOPATH: "{{ ansible_env.HOME }}/.local/share/go"
  when: ansible_facts['os_family'] != 'Darwin'
  tags: ["go", "dev"]
