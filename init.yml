- hosts:
    - localhost
  vars:
    source_key: "./secrets/ssh/id_rsa"
    source_key_pub: "./secrets/ssh/id_rsa.pub"
    dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
    dest_key_pub: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa.pub"
    me: "{{ lookup('env', 'USER') }}"
    is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
    is_linux: "{{ ansible_facts['os_family'] != 'Darwin' }}"
    is_arch: "{{ ansible_facts['os_family'] == 'Archlinux' }}"
    is_debian: "{{ ansible_facts['os_family'] == 'Debian' }}"
    is_wsl: "{{ lookup('env', 'WSL_DISTRO_NAME') != '' }}"

  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:

    - name: Update apt cache (Debian/Ubuntu only)
      become: true
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        state: present
      when: ansible_facts['os_family'] == 'Debian'

  environment:
    XDG_CONFIG_HOME: "{{ ansible_env.HOME }}/.config"
    XDG_CACHE_HOME: "{{ ansible_env.HOME }}/.cache"
    XDG_DATA_HOME: "{{ ansible_env.HOME }}/.local/share"
    XDG_STATE_HOME: "{{ ansible_env.HOME }}/.local/state"
    ZDOTDIR: "{{ ansible_env.HOME }}/.config/zsh"
    ZSH: "{{ ansible_env.HOME }}/.config/zsh/ohmyzsh"
    CARGO_HOME: "{{ ansible_env.HOME }}/.local/share/cargo"
    RUSTUP_HOME: "{{ ansible_env.HOME }}/.local/share/rustup"
    BUN_INSTALL: "{{ ansible_env.HOME }}/.local/share/bun"
    GOPATH: "{{ ansible_env.HOME }}/.local/share/go"
    DOCKER_CONFIG: "{{ ansible_env.HOME }}/.config/docker"
    ANSIBLE_HOME: "{{ ansible_env.HOME }}/.local/share/ansible"
    GNUPGHOME: "{{ ansible_env.HOME }}/.local/share/gnupg"

  roles:
    # package managers — mutually exclusive by OS family
    - role: homebrew
      when: is_macos | bool
    - role: apt
      when: is_debian | bool
    - role: pacman
      when: is_arch | bool

    - dirs
    - role: ssh
      when: inventory_hostname == "localhost"
    - dotfiles
    - zsh
    - neovim
    - role: fonts
      when: is_linux | bool
    - tools
    - role: 1password
      when: is_debian | bool  # Arch: via pacman AUR; macOS: via homebrew cask
    - rust
    - go
    - mise
    - role: node
      when: inventory_hostname == "localhost"
    - k8s
